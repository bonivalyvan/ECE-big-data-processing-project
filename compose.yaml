services:
  spark:
    build:
      context: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace
    command: ["-m", "src.prepare_data"]

  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      start_period: 30s
      interval: 10s
      timeout: 30s
      retries: 12

  wikipedia-producer:
    build:
      context: .
    profiles: ["streaming"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace
    command:
      [
        "-m",
        "src.wikipedia_stream_producer",
        "--bootstrap-servers",
        "kafka:9092",
      ]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  spark-streaming:
    build:
      context: .
    profiles: ["streaming"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace
    command:
      [
        "-m",
        "src.stream_wikipedia_changes",
        "--bootstrap-servers",
        "kafka:9092",
        "--starting-offsets",
        "latest",
      ]
    depends_on:
      kafka:
        condition: service_healthy
      wikipedia-producer:
        condition: service_started
    restart: unless-stopped

volumes:
  kafka-data:
